services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_EXPOSED_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql

  app:
    image: ${KEYCLOAK_IMAGE_REGISTRY:-quay.io/keycloak/keycloak}:${KEYCLOAK_IMAGE_TAG:-26.8.0}
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${DATABASE_NAME}
      KC_DB_USERNAME: ${DATABASE_USERNAME}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD}

      # Bootstrap admin user
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}

      # HTTPS configuration
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/target/keycloak-server.crt.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/target/keycloak-server.key.pem
      KC_HTTPS_PORT: ${KEYCLOAK_HTTPS_PORT}
      KC_HOSTNAME_STRICT: false

    volumes:
      - ./target:/opt/keycloak/target
      # Realm keystores under ${kc.home.dir}/data/<realm>/ (Keycloak 26.6.4+)
      - ./target/keycloak-data:/opt/keycloak/data
      # Drop extra providers (e.g. the Token Status plugin for revocable
      # credentials) into ./providers to mount them into Keycloak.
      - ./providers:/opt/keycloak/providers

    command:
      - start
      - --features=${KEYCLOAK_FEATURES}

    depends_on:
      - db

    ports:
      - "${KEYCLOAK_HTTPS_PORT}:${KEYCLOAK_HTTPS_PORT}"

  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    profiles: ["cli"]
    network_mode: host
    working_dir: /workspace
    environment:
      WORK_DIR: /workspace
      KEYCLOAK_SSI_IN_CONTAINER: "1"
      COMPOSE_PROJECT_NAME: "oid4vci-deployment"
      # Host project root (CLI remaps /workspace → host path for Keycloak)
      HOST_WORK_DIR: ${HOST_WORK_DIR:-${PWD}}
    volumes:
      - .:/workspace
      - ./target:/workspace/target
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["bash", "keycloak-ssi.sh"]

  # ---------------------------------------------------------------------------
  # Status list server (OAuth Token Status List) for revocable credentials.
  # Runs behind the `status-list` profile. Uses the in-memory image from the
  # status-list-server registry (see config.yaml: status_list.image).
  # Keycloak reaches it at status_list.server_url.
  status-list-server:
    profiles: ["status-list"]
    image: ${STATUS_LIST_IMAGE:-ghcr.io/adorsys/status-list-server:v1.2.0-memory}
    container_name: status-list-server
    environment:
      APP_ENV: development
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: 8000
      APP_SERVER__MANAGEMENT__HOST: 0.0.0.0
      APP_SERVER__MANAGEMENT__PORT: 8001
      APP_SERVER__ADMIN__HOST: 0.0.0.0
      APP_SERVER__ADMIN__PORT: 8002
      APP_SERVER__CERT__STORE__CERTIFICATE_PATH: /etc/status-list/certs/dev.crt
      APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: /etc/status-list/certs/dev.key
      APP_CACHE__BACKEND: memory
      APP_TELEMETRY__ENABLED: "false"
    ports:
      - "${STATUS_LIST_PUBLIC_PORT:-8000}:8000"
      - "${STATUS_LIST_MANAGEMENT_PORT:-8001}:8001"
      - "${STATUS_LIST_ADMIN_PORT:-8002}:8002"
    volumes:
      - ./certs/status-list:/etc/status-list/certs:ro

volumes:
  db_data:
