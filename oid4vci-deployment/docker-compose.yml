services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_EXPOSED_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql

  app:
    image: quay.io/keycloak/keycloak:26.5

    # Previous custom image (kept for reference)
    # image: ghcr.io/adorsys/keycloak-ssi-deployment:latest
    # build:
    #   context: .

    environment:
      # ---------------------------------------------------------------------
      # Database configuration
      # ---------------------------------------------------------------------
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${DATABASE_NAME}
      KC_DB_USERNAME: ${DATABASE_USERNAME}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD}

      # DATABASE_OPTS is only relevant for the custom Keycloak deployment image.
      # It is NOT required by the official Keycloak image, which uses KC_* vars.
      DATABASE_OPTS: >
        --db postgres
        --db-url jdbc:postgresql://db:5432/${DATABASE_NAME}
        --db-username ${DATABASE_USERNAME}
        --db-password ${DATABASE_PASSWORD}

      # ---------------------------------------------------------------------
      # Bootstrap admin user
      # ---------------------------------------------------------------------
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}

      # ---------------------------------------------------------------------
      # HTTPS configuration
      # ---------------------------------------------------------------------
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/target/keycloak-server.crt.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/target/keycloak-server.key.pem
      KC_HTTPS_PORT: ${KEYCLOAK_HTTPS_PORT}
      KC_HOSTNAME_STRICT: false

    # Mount TLS certificates generated by OID4VCI setup
    volumes:
      - ./target:/opt/keycloak/target

    command:
      - start
      - --features=oid4vc-vci

    depends_on:
      - db

    ports:
      - "${KEYCLOAK_HTTPS_PORT}:${KEYCLOAK_HTTPS_PORT}"

volumes:
  db_data:
