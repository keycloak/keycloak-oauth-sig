name: run-conformance-tests
run-name: ${{ github.actor }} is running FAPI conformance tests

on:
  workflow_dispatch:

jobs:
  run-conformance-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: [fapi1-advanced, fapi2-sp-final, fapi2-ms-final, fapi-ciba]
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - name: Add hosts entries
        run: |
          sudo echo "127.0.0.1 as.keycloak-fapi.org aes.keycloak-fapi.org rs.keycloak-fapi.org cs.keycloak-fapi.org conformance-suite.keycloak-fapi.org" | sudo tee -a /etc/hosts

      - name: Run conformance tests
        run: |
          set +e
          set -o pipefail
          docker compose -p keycloak-fapi -f conformance-tests-env/docker-compose.yml up --build --exit-code-from test_runner | tee ${{ github.workspace }}/outputs.txt
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "failed" > ${{ github.workspace }}/test-result.txt
            REASON=$(grep "test_runner-1 exited with code" ${{ github.workspace }}/outputs.txt || echo "test_runner exited with code $EXIT_CODE")
            echo "$REASON" >> ${{ github.workspace }}/test-result.txt
          else
            echo "success" > ${{ github.workspace }}/test-result.txt
          fi
          exit $EXIT_CODE
        env:
          OPENID_GIT_URL: https://gitlab.com/openid/conformance-suite.git
          OPENID_GIT_TAG: release-v5.1.45
          RESOURCE_FQDN: rs.keycloak-fapi.org
          CONSENT_FQDN: cs.keycloak-fapi.org
          CONFORMANCE_SUITE_FQDN: conformance-suite.keycloak-fapi.org
          AUTOMATE_TESTS: true
          TEST_PLAN: --${{ matrix.profile }}-all-ci
          KEYCLOAK_BASE_IMAGE: quay.io/keycloak/keycloak:26.7.0
          KEYCLOAK_REALM: test
          KEYCLOAK_USER: admin
          KEYCLOAK_PASSWORD: admin
          KEYCLOAK_REALM_IMPORT_FILENAME: realm-${{ matrix.profile }}.json
          KEYCLOAK_FQDN: as.keycloak-fapi.org
          AUTH_ENTITY_FQDN: aes.keycloak-fapi.org
          KEYCLOAK_FRONTEND_URL: https://as.keycloak-fapi.org/auth
          KEYCLOAK_INTROSPECTION_ENDPOINT_FROM_API_GATEWAY: https://as.keycloak-fapi.org/auth/realms/test/protocol/openid-connect/token/introspect
          KEYCLOAK_SPI_0: custom-spi.txt

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-test-outputs-${{ matrix.profile }}
          path: |
            ${{ github.workspace }}/outputs.txt
            ${{ github.workspace }}/test-result.txt

  evaluate-test-results:
    needs: [run-conformance-test]
    runs-on: ubuntu-latest
    if: always()
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download test outputs
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-test-outputs-*
          path: matrix-job-outputs

      - name: Check for job failures
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const directory = path.resolve('./matrix-job-outputs')
            const failures = []

            for (const dirName of fs.readdirSync(directory)) {
              const resultFilePath = path.join(directory, dirName, 'test-result.txt')
              if (!fs.existsSync(resultFilePath)) continue

              const profileMatch = dirName.match(/conformance-test-outputs-(.+)/)
              const profileName = profileMatch ? profileMatch[1] : dirName

              const content = fs.readFileSync(resultFilePath, 'utf8').trim()
              const lines = content.split('\n')
              const result = lines[0]

              if (result === 'failed') {
                const reason = lines.slice(1).join('\n') || 'Unknown reason'
                failures.push({ profile: profileName, reason })
              }
            }

            if (failures.length > 0) {
              core.error('The following conformance test jobs failed:')
              for (const f of failures) {
                core.error(`  - Profile "${f.profile}": ${f.reason}`)
              }
              core.setFailed(`${failures.length} conformance test job(s) failed`)
            } else {
              core.info('All conformance test jobs completed successfully')
            }

      - name: Evaluate results
        run: node .github/scripts/evaluate-results.js

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: all-tests-outputs
          path: ${{ github.workspace }}/all-tests-outputs.txt
